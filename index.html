<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subway Surf Web</title>
    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            text-align: center;
            font-family: Arial;
        }

        #gameCanvas {
            background: #1e1e1e;
            width: 100%;
            max-width: 900px;
            height: 450px;
            border: 3px solid white;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<h1>Subway Surf — Versão Web Estável</h1>

<canvas id="gameCanvas" width="900" height="450"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// Pistas em perspectiva simples
const lanePositions = [-120, 0, 120]; // esquerda, meio, direita

// Jogador
let player = {
    lane: 1,
    y: 320,
    size: 40,
    jumping: false,
    jumpY: 0,
    jumpSpeed: 0
};

// Obstáculos
let obstacles = [];
let speed = 6; // velocidade da pista

function spawnObstacle() {
    const lane = Math.floor(Math.random() * 3);
    obstacles.push({
        lane: lane,
        z: 900 // começa longe
    });
}

// Criar obstáculos repetidamente
setInterval(spawnObstacle, 1200);

// Controles
document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft" && player.lane > 0) player.lane--;
    if (e.key === "ArrowRight" && player.lane < 2) player.lane++;

    if (e.key === " " && !player.jumping) {
        player.jumping = true;
        player.jumpSpeed = 14;
    }
});

// Desenhar chão 3D FALSO simples
function drawGround() {
    ctx.fillStyle = "#333";
    ctx.fillRect(0, 250, canvas.width, 200);
}

// Desenhar jogador
function drawPlayer() {
    const x = 450 + lanePositions[player.lane];
    const y = player.y - player.jumpY;

    ctx.fillStyle = "yellow";
    ctx.fillRect(x - player.size/2, y - player.size, player.size, player.size);
}

// Desenhar obstáculos chegando
function drawObstacles() {
    obstacles.forEach(o => {
        o.z -= speed;

        const scale = 200 / (o.z + 200); 
        const size = 40 * scale;
        const x = 450 + lanePositions[o.lane] * scale;
        const y = 260 + (1 - scale) * 200;

        ctx.fillStyle = "red";
        ctx.fillRect(x - size/2, y - size, size, size);
    });

    obstacles = obstacles.filter(o => o.z > -50);
}

// Física do pulo
function updateJump() {
    if (player.jumping) {
        player.jumpY += player.jumpSpeed;
        player.jumpSpeed -= 1;

        if (player.jumpY <= 0) {
            player.jumping = false;
            player.jumpY = 0;
        }
    }
}

// Checar colisão
function checkCollision() {
    obstacles.forEach(o => {
        if (o.lane === player.lane && o.z < 80 && player.jumpY < 40) {
            alert("💥 Você bateu!");
            obstacles = [];
        }
    });
}

// Loop principal
function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    drawGround();
    drawObstacles();
    drawPlayer();

    updateJump();
    checkCollision();

    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
